services:
  mcp:
    image: ghcr.io/lsfusion/mcp:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      RAG_VECTOR_STORE_ID: ${RAG_VECTOR_STORE_ID}
 #    MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: 8000
      LOG_DIR: /data/logs
      # The corpus snapshot the server can search in-process. RETRIEVAL_BACKEND
      # is the canary switch: "local" uses it, anything else (or a missing /
      # refused snapshot, or an embeddings outage) serves from the OpenAI
      # vector store, which is how this has always worked.
      RAG_SNAPSHOT_PATH: /data/snapshot/corpus.npz
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-store}
 #     PUBLIC_MCP_URL: ${PUBLIC_MCP_URL}
    expose:
      - "8000"
    volumes:
      - ./mcp-data/logs:/data/logs
      - ./mcp-data/snapshot:/data/snapshot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  proxy:
    image: ghcr.io/lsfusion/openai:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      MODEL_ID: ${MODEL_ID}
    expose:
      - "4000"
    depends_on:
      - mcp
    restart: unless-stopped

  proxy-mcp:
    image: ghcr.io/lsfusion/openai:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      MODEL_ID: ${MODEL_ID}

      MCP_URL: https://${DOMAIN}/${MCP_PATH}
    expose:
      - "4000"
    depends_on:
      - mcp
    restart: unless-stopped

