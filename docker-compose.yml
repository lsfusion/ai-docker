services:
  mcp:
    image: ghcr.io/lsfusion/mcp:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_PORT: 8000
      LOG_DIR: /data/logs
      RAG_SNAPSHOT_PATH: /data/snapshot/corpus.npz
    expose:
      - "8000"
    volumes:
      - ./mcp-data/logs:/data/logs
      - ./mcp-data/snapshot:/data/snapshot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      MCP_PATH: ${MCP_PATH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
